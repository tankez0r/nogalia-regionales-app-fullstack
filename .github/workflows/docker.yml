name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  imagen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nogalina
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Construir para probar
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nogalina:prueba

      - name: Probar la imagen
        run: |
          docker run -d --name prueba -p 8080:80 nogalina:prueba
          curl -fsS --retry 10 --retry-all-errors --retry-delay 2 -o /dev/null http://127.0.0.1:8080/index.html
          docker rm -f prueba

      - name: Publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
