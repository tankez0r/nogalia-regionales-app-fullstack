<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nogalina Regionales</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Nogalina Regionales</h1>
    <p>Productos regionales de Famatina, La Rioja</p>
    <p><a href="ventas.html">Ventas</a></p>
  </header>

  <main>
    <section id="mensajes" aria-live="polite"></section>

    <section class="filtros">
      <input id="filtro-categoria" type="text" placeholder="Categoría">
      <input id="filtro-q" type="text" placeholder="Buscar por nombre, origen o descripción">
      <label><input id="filtro-bajo" type="checkbox"> Solo bajo stock</label>
    </section>

    <section class="panel">
      <h2 id="form-titulo">Nuevo producto</h2>
      <form id="form-producto">
        <input type="hidden" id="producto-id">
        <label>Nombre <input id="nombre" type="text" required></label>
        <label>Categoría <input id="categoria" type="text" required></label>
        <label>Precio <input id="precio" type="number" step="0.01" min="0" required></label>
        <label>Stock <input id="stock" type="number" min="0" required></label>
        <label>Stock mínimo <input id="stock_minimo" type="number" min="0" required></label>
        <label>Unidad <input id="unidad" type="text" placeholder="kg, unidad, docena"></label>
        <label>Origen / proveedor <input id="origen" type="text"></label>
        <label>Descripción <textarea id="descripcion"></textarea></label>
        <div class="botones">
          <button type="submit" id="btn-guardar">Guardar</button>
          <button type="button" id="btn-cancelar">Cancelar</button>
        </div>
      </form>
    </section>

    <section class="tabla">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Categoría</th><th>Precio</th>
            <th>Stock</th><th>Mínimo</th><th>Origen</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
      </table>
    </section>

    <section>
      <h2>Clima hoy en Famatina</h2>
      <div id="clima" class="clima">Cargando el clima...</div>
    </section>

    <section>
      <h2>Dónde estamos</h2>
      <div id="mapa"></div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="comun.js"></script>
  <script src="app.js"></script>
</body>
</html>
